name: Neilsonks — Webdock

on:
  push:
    branches: [main]
    paths:
      - 'neilsonks/**'
      - 'scripts/deploy-webdock.sh'
      - 'scripts/webdock-release.py'
      - 'tests/test_webdock_release.py'
      - '.github/workflows/neilsonks-webdock.yml'
  pull_request:
    branches: [main]
    paths:
      - 'neilsonks/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/neilsonks-webdock.yml'
  workflow_dispatch:
    inputs:
      deployment:
        description: 'Check only, upload an inactive release, or publish (after the live-file audit)'
        type: choice
        options: [check, stage, publish]
        default: check

permissions:
  contents: read

# Never interrupt a deployment while it is switching the live release.
concurrency:
  group: neilsonks-webdock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    name: Test, build, and optionally deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: neilsonks
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: neilsonks/package-lock.json
      - name: Check deployment helpers
        working-directory: .
        run: |
          bash -n scripts/deploy-webdock.sh
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and test the simulation
        run: npm run check
      - name: Build and verify public output
        run: npm run build
      - name: Deploy to Webdock
        if: >-
          github.ref == 'refs/heads/main' &&
          ((github.event_name == 'workflow_dispatch' && inputs.deployment != 'check') ||
           (github.event_name == 'push' && vars.WEBDOCK_AUTO_DEPLOY == 'true'))
        working-directory: .
        env:
          WEBDOCK_HOST: ${{ secrets.WEBDOCK_HOST }}
          WEBDOCK_USER: ${{ secrets.WEBDOCK_USER }}
          WEBDOCK_SSH_KEY: ${{ secrets.WEBDOCK_SSH_KEY }}
          WEBDOCK_KNOWN_HOSTS: ${{ secrets.WEBDOCK_KNOWN_HOSTS }}
          WEBDOCK_SSH_PORT: ${{ vars.WEBDOCK_SSH_PORT || '22' }}
          WEBDOCK_DEPLOY_PATH: ${{ vars.WEBDOCK_DEPLOY_PATH }}
          WEBDOCK_SITE_URL: ${{ vars.WEBDOCK_SITE_URL }}
          WEBDOCK_ACTIVATE: ${{ (github.event_name == 'push' || inputs.deployment == 'publish') && 'true' || 'false' }}
        run: bash scripts/deploy-webdock.sh
